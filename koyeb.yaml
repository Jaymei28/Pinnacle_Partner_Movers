name: job-portal-backend
services:
  - name: backend
    type: web
    regions:
      - fra
    instance_type: nano
    docker:
      command: gunicorn jobstream_backend.wsgi:application --bind 0.0.0.0:8000
    ports:
      - port: 8000
        protocol: http
    routes:
      - path: /
        port: 8000
    env:
      - key: DATABASE_URL
        value: "{{ secret.DATABASE_URL }}"
      - key: SECRET_KEY
        value: "{{ secret.SECRET_KEY }}"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DEBUG
        value: "False"
