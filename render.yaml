services:
  # Backend
  - type: web
    name: jobstream-backend
    env: python
    plan: starter
    buildCommand: "sh build.sh"
    startCommand: "gunicorn jobstream_backend.wsgi:application"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobstream-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        value: admin1234
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com

  # Frontend (Static Site)
  - type: web
    name: jobstream-frontend
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          name: jobstream-backend
          type: web
          property: host

databases:
  - name: jobstream-db
    databaseName: jobstream_db
    plan: starter
    user: db_admin
