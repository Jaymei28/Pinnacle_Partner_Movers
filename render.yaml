services:
  # Backend
  - type: web
    name: jobstream-backend
    env: python
    buildCommand: "./backend/build.sh"
    startCommand: "gunicorn jobstream_backend.wsgi:application"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobstream-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: "*" # Set this to your app domain after deployment

  # Frontend
  - type: web
    name: jobstream-frontend
    env: static
    buildCommand: "npm install && npm run build"
    publishPath: frontend/dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          name: jobstream-backend
          type: web
          property: host

databases:
  - name: jobstream-db
    databaseName: jobstream_db
    user: postgres
